<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积木零件补寄选择器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .course-selector {
            margin-bottom: 30px;
        }
        
        .course-selector label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .course-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .course-btn {
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #555;
        }
        
        .course-btn:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }
        
        .course-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .parts-section {
            display: none;
            animation: fadeIn 0.5s;
        }
        
        .parts-section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .part-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            background: white;
        }
        
        .part-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .part-card.selected {
            border-color: #4CAF50;
            background: #f1f8e9;
        }
        
        .part-card.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .part-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .part-code {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }
        
        .part-quantity {
            margin-top: 10px;
            display: none;
        }
        
        .part-card.selected .part-quantity {
            display: block;
        }
        
        .quantity-input {
            width: 60px;
            padding: 5px;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17,153,142,0.4);
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .selected-parts-summary {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .selected-parts-summary h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .selected-parts-list {
            font-size: 13px;
            color: #666;
        }
        
        .selected-parts-list div {
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .selected-parts-list div:last-child {
            border-bottom: none;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            background: #e0e0e0;
        }
        
        .modal-content {
            position: relative;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .category-tab {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .category-tab:hover {
            border-color: #667eea;
        }
        
        .category-tab.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .success-message {
            display: none;
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        
        .success-message.active {
            display: block;
            animation: fadeIn 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 积木零件补寄选择器</h1>
            <p>选择课线 → 选择零件 → 填写信息 → 提交补寄申请</p>
        </div>
        
        <div class="content">
            <!-- 课线选择 -->
            <div class="course-selector">
                <label>第一步：选择您的课线</label>
                <div class="course-buttons">
                    <div class="course-btn" data-course="robot-advanced">
                        🤖 机器人进阶课
                    </div>
                    <div class="course-btn" data-course="rocket">
                        🚀 小火箭育才班
                    </div>
                    <div class="course-btn" data-course="moon-basic">
                        🌙 探月初阶育才班
                    </div>
                    <div class="course-btn" data-course="other">
                        📚 其他课线
                    </div>
                </div>
            </div>
            
            <!-- 零件选择区域 -->
            <div id="parts-section" class="parts-section">
                <div class="section-title">第二步：选择需要补寄的零件</div>
                
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 搜索零件名称或编号...">
                </div>
                
                <div class="category-tabs">
                    <div class="category-tab active" data-category="all">全部</div>
                    <div class="category-tab" data-category="beam">梁类</div>
                    <div class="category-tab" data-category="connector">连接件</div>
                    <div class="category-tab" data-category="axle">轴类</div>
                    <div class="category-tab" data-category="gear">齿轮</div>
                    <div class="category-tab" data-category="wheel">轮类</div>
                    <div class="category-tab" data-category="pin">销类</div>
                    <div class="category-tab" data-category="other">其他</div>
                </div>
                
                <div id="parts-grid" class="parts-grid">
                    <!-- 零件卡片将动态生成 -->
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="clearSelection()">清空选择</button>
                    <button class="btn btn-primary" onclick="showSummary()">查看已选零件 (<span id="selected-count">0</span>)</button>
                    <button class="btn btn-success" onclick="submitOrder()">提交补寄申请</button>
                </div>
            </div>
            
            <!-- 成功提示 -->
            <div id="success-message" class="success-message">
                <h3>✅ 补寄申请已提交！</h3>
                <p>我们会尽快处理您的申请，请保持手机畅通。</p>
            </div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div id="summary-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="modal-header">📋 已选零件清单</div>
            
            <div class="selected-parts-summary">
                <h4>课线：<span id="modal-course-name"></span></h4>
                <div id="modal-parts-list" class="selected-parts-list"></div>
            </div>
            
            <div class="form-group">
                <label>* 收货人姓名</label>
                <input type="text" id="recipient-name" placeholder="请输入收货人姓名">
            </div>
            
            <div class="form-group">
                <label>* 手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号码">
            </div>
            
            <div class="form-group">
                <label>* 省份</label>
                <input type="text" id="province" placeholder="请输入省份">
            </div>
            
            <div class="form-group">
                <label>* 城市</label>
                <input type="text" id="city" placeholder="请输入城市">
            </div>
            
            <div class="form-group">
                <label>* 区/县</label>
                <input type="text" id="district" placeholder="请输入区/县">
            </div>
            
            <div class="form-group">
                <label>* 详细地址</label>
                <textarea id="address" placeholder="请输入详细地址"></textarea>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="exportCSV()">导出CSV文件</button>
                <button class="btn btn-success" onclick="confirmSubmit()">确认提交</button>
            </div>
        </div>
    </div>

    <script>
        // 零件数据库（基于图片识别的通用零件库）
        const partsDatabase = [
            // 梁类
            { id: 'beam-1', name: '1孔梁', code: 'T6201', category: 'beam' },
            { id: 'beam-2', name: '2孔梁', code: 'T6202', category: 'beam' },
            { id: 'beam-3', name: '3孔梁', code: 'T6203', category: 'beam' },
            { id: 'beam-4', name: '4孔梁', code: 'T6204', category: 'beam' },
            { id: 'beam-5', name: '5孔梁', code: 'T6205', category: 'beam' },
            { id: 'beam-6', name: '6孔梁', code: 'T6206', category: 'beam' },
            { id: 'beam-7', name: '7孔梁', code: 'T6207', category: 'beam' },
            { id: 'beam-8', name: '8孔梁', code: 'T6208', category: 'beam' },
            { id: 'beam-9', name: '9孔梁', code: 'T6209', category: 'beam' },
            { id: 'beam-10', name: '10孔梁', code: 'T6210', category: 'beam' },
            { id: 'beam-11', name: '11孔梁', code: 'T6211', category: 'beam' },
            { id: 'beam-12', name: '12孔梁', code: 'T6212', category: 'beam' },
            { id: 'beam-13', name: '13孔梁', code: 'T6213', category: 'beam' },
            { id: 'beam-14', name: '14孔梁', code: 'T6214', category: 'beam' },
            { id: 'beam-15', name: '15孔梁', code: 'T6215', category: 'beam' },
            { id: 'beam-16', name: '16孔梁', code: 'T6216', category: 'beam' },
            
            // 连接件
            { id: 'conn-1', name: '十字轴连接器', code: 'TG4401', category: 'connector' },
            { id: 'conn-2', name: 'L型连接器', code: 'TG4402', category: 'connector' },
            { id: 'conn-3', name: 'T型连接器', code: 'TG4403', category: 'connector' },
            { id: 'conn-4', name: '十字连接器', code: 'TG4404', category: 'connector' },
            { id: 'conn-5', name: '角度连接器', code: 'TG4405', category: 'connector' },
            { id: 'conn-6', name: '框架连接器', code: 'TG4406', category: 'connector' },
            
            // 轴类
            { id: 'axle-1', name: '2号轴', code: 'TG4411', category: 'axle' },
            { id: 'axle-2', name: '3号轴', code: 'TG4412', category: 'axle' },
            { id: 'axle-3', name: '4号轴', code: 'TG4413', category: 'axle' },
            { id: 'axle-4', name: '5号轴', code: 'TG4414', category: 'axle' },
            { id: 'axle-5', name: '6号轴', code: 'TG4415', category: 'axle' },
            { id: 'axle-6', name: '7号轴', code: 'TG4416', category: 'axle' },
            { id: 'axle-7', name: '8号轴', code: 'TG4417', category: 'axle' },
            { id: 'axle-8', name: '9号轴', code: 'TG4418', category: 'axle' },
            { id: 'axle-9', name: '10号轴', code: 'TG4419', category: 'axle' },
            { id: 'axle-10', name: '11号轴', code: 'TG4420', category: 'axle' },
            { id: 'axle-11', name: '12号轴', code: 'TG4421', category: 'axle' },
            
            // 齿轮
            { id: 'gear-1', name: '8齿齿轮', code: 'TG4431', category: 'gear' },
            { id: 'gear-2', name: '12齿齿轮', code: 'TG4432', category: 'gear' },
            { id: 'gear-3', name: '16齿齿轮', code: 'TG4433', category: 'gear' },
            { id: 'gear-4', name: '20齿齿轮', code: 'TG4434', category: 'gear' },
            { id: 'gear-5', name: '24齿齿轮', code: 'TG4435', category: 'gear' },
            { id: 'gear-6', name: '28齿齿轮', code: 'TG4436', category: 'gear' },
            { id: 'gear-7', name: '36齿齿轮', code: 'TG4437', category: 'gear' },
            { id: 'gear-8', name: '40齿齿轮', code: 'TG4438', category: 'gear' },
            { id: 'gear-9', name: '冠状齿轮', code: 'TG4439', category: 'gear' },
            { id: 'gear-10', name: '锥齿轮', code: 'TG4440', category: 'gear' },
            { id: 'gear-11', name: '蜗轮', code: 'TG4441', category: 'gear' },
            
            // 轮类
            { id: 'wheel-1', name: '小轮', code: 'TG4451', category: 'wheel' },
            { id: 'wheel-2', name: '中轮', code: 'TG4452', category: 'wheel' },
            { id: 'wheel-3', name: '大轮', code: 'TG4453', category: 'wheel' },
            { id: 'wheel-4', name: '宽轮', code: 'TG4454', category: 'wheel' },
            { id: 'wheel-5', name: '轮胎', code: 'TG4455', category: 'wheel' },
            
            // 销类
            { id: 'pin-1', name: '短销', code: 'TG4461', category: 'pin' },
            { id: 'pin-2', name: '长销', code: 'TG4462', category: 'pin' },
            { id: 'pin-3', name: '带摩擦销', code: 'TG4463', category: 'pin' },
            { id: 'pin-4', name: '双头销', code: 'TG4464', category: 'pin' },
            { id: 'pin-5', name: '轴套', code: 'TG4465', category: 'pin' },
            
            // 其他
            { id: 'other-1', name: '电机', code: 'GDS-1001', category: 'other' },
            { id: 'other-2', name: '主控', code: 'GDS-1002', category: 'other' },
            { id: 'other-3', name: '传感器', code: 'GDS-1003', category: 'other' },
            { id: 'other-4', name: '电池盒', code: 'GDS-1004', category: 'other' },
            { id: 'other-5', name: '线缆', code: 'GDS-1005', category: 'other' },
            { id: 'other-6', name: '底板', code: 'GDS-1006', category: 'other' },
            { id: 'other-7', name: '装饰件', code: 'GDS-1007', category: 'other' },
            { id: 'other-8', name: '连接块', code: 'GDS-1008', category: 'other' },
            { id: 'other-9', name: '滑轮', code: 'GDS-1009', category: 'other' },
            { id: 'other-10', name: '皮带轮', code: 'GDS-1010', category: 'other' }
        ];
        
        // 课线名称映射
        const courseNames = {
            'robot-advanced': '机器人进阶课',
            'rocket': '小火箭育才班',
            'moon-basic': '探月初阶育才班',
            'other': '其他课线'
        };
        
        let selectedCourse = null;
        let selectedParts = new Map();
        let currentCategory = 'all';
        
        // 课线选择
        document.querySelectorAll('.course-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.course-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedCourse = this.dataset.course;
                
                document.getElementById('parts-section').classList.add('active');
                renderParts();
            });
        });
        
        // 分类标签切换
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderParts();
            });
        });
        
        // 搜索功能
        document.getElementById('search-input').addEventListener('input', function() {
            renderParts();
        });
        
        // 渲染零件列表
        function renderParts() {
            const grid = document.getElementById('parts-grid');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            grid.innerHTML = '';
            
            const filteredParts = partsDatabase.filter(part => {
                const matchCategory = currentCategory === 'all' || part.category === currentCategory;
                const matchSearch = part.name.toLowerCase().includes(searchTerm) || 
                                   part.code.toLowerCase().includes(searchTerm);
                return matchCategory && matchSearch;
            });
            
            filteredParts.forEach(part => {
                const card = document.createElement('div');
                card.className = `part-card ${selectedParts.has(part.id) ? 'selected' : ''}`;
                card.dataset.id = part.id;
                
                card.innerHTML = `
                    <div class="part-name">${part.name}</div>
                    <div class="part-code">${part.code}</div>
                    <div class="part-quantity">
                        <label>数量：</label>
                        <input type="number" class="quantity-input" value="1" min="1" max="99" 
                               onchange="updateQuantity('${part.id}', this.value)">
                    </div>
                `;
                
                card.addEventListener('click', function(e) {
                    if (e.target.classList.contains('quantity-input')) return;
                    togglePart(part.id);
                });
                
                grid.appendChild(card);
            });
        }
        
        // 切换零件选择
        function togglePart(partId) {
            if (selectedParts.has(partId)) {
                selectedParts.delete(partId);
            } else {
                selectedParts.set(partId, 1);
            }
            updateSelectedCount();
            renderParts();
        }
        
        // 更新数量
        function updateQuantity(partId, quantity) {
            if (selectedParts.has(partId)) {
                selectedParts.set(partId, parseInt(quantity));
            }
        }
        
        // 更新已选数量显示
        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedParts.size;
        }
        
        // 清空选择
        function clearSelection() {
            selectedParts.clear();
            updateSelectedCount();
            renderParts();
        }
        
        // 显示已选零件摘要
        function showSummary() {
            if (selectedParts.size === 0) {
                alert('请先选择需要补寄的零件！');
                return;
            }
            
            document.getElementById('modal-course-name').textContent = courseNames[selectedCourse];
            
            const partsList = document.getElementById('modal-parts-list');
            partsList.innerHTML = '';
            
            selectedParts.forEach((quantity, partId) => {
                const part = partsDatabase.find(p => p.id === partId);
                if (part) {
                    const div = document.createElement('div');
                    div.textContent = `${part.name} (${part.code}) × ${quantity}`;
                    partsList.appendChild(div);
                }
            });
            
            document.getElementById('summary-modal').classList.add('active');
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('summary-modal').classList.remove('active');
        }
        
        // 提交补寄申请
        function submitOrder() {
            if (selectedParts.size === 0) {
                alert('请先选择需要补寄的零件！');
                return;
            }
            showSummary();
        }
        
        // 确认提交
        function confirmSubmit() {
            const recipientName = document.getElementById('recipient-name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const province = document.getElementById('province').value.trim();
            const city = document.getElementById('city').value.trim();
            const district = document.getElementById('district').value.trim();
            const address = document.getElementById('address').value.trim();
            
            if (!recipientName || !phone || !province || !city || !district || !address) {
                alert('请填写完整的收货信息！');
                return;
            }
            
            // 构建订单数据
            const orderData = {
                course: courseNames[selectedCourse],
                recipient: {
                    name: recipientName,
                    phone: phone,
                    province: province,
                    city: city,
                    district: district,
                    address: address
                },
                parts: []
            };
            
            selectedParts.forEach((quantity, partId) => {
                const part = partsDatabase.find(p => p.id === partId);
                if (part) {
                    orderData.parts.push({
                        name: part.name,
                        code: part.code,
                        quantity: quantity
                    });
                }
            });
            
            // 打印订单数据（实际应用中可以发送到服务器）
            console.log('补寄申请数据：', orderData);
            
            // 显示成功提示
            closeModal();
            document.getElementById('success-message').classList.add('active');
            
            // 3秒后隐藏成功提示
            setTimeout(() => {
                document.getElementById('success-message').classList.remove('active');
            }, 3000);
            
            // 清空表单
            document.getElementById('recipient-name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('province').value = '';
            document.getElementById('city').value = '';
            document.getElementById('district').value = '';
            document.getElementById('address').value = '';
        }
        
        // 点击弹窗外部关闭
        document.getElementById('summary-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
